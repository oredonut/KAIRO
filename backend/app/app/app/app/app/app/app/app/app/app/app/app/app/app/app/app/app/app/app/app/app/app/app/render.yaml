services:
  # ── FastAPI Backend ──
  - type: web
    name: kairo-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kairo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kairo-redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SQUAD_SECRET_KEY
        sync: false
      - key: SQUAD_BASE_URL
        value: https://sandbox-api-d.squadco.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

# ── Database ──
databases:
  - name: kairo-db
    plan: free

# ── Redis ──
redis:
  - name: kairo-redis
    plan: free
    ipAllowList: [] # Only allow internal connections
